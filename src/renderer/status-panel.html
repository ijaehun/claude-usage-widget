<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        font-src 'self';
        img-src 'self' data:;
        connect-src 'none';
    ">
    <title>Claude Service Status</title>
    <link rel="stylesheet" href="status-panel.css">
</head>

<body>
    <!-- #panel, not body, is what status-panel.js measures: body fills the
         window, so its height would just report whatever the window already is
         and the panel could never size itself to its content. -->
    <div class="panel" id="panel">
        <!-- One section per tracked service; the ?services= query hides the
             other. -->
        <div class="panel-section" id="claudeSection">
            <div class="panel-head">
                <span class="panel-title" data-i18n>Claude service status</span>
                <span class="panel-overall" id="panelOverall" data-i18n>Checking…</span>
            </div>

            <div class="panel-rows" id="panelRows"></div>

            <!-- Only rendered when there is something unresolved. -->
            <div class="panel-incidents" id="panelIncidents" style="display: none;"></div>
        </div>

        <!-- status.openai.com sends no incident list, so this section is rows
             only. -->
        <div class="panel-section" id="codexSection">
            <div class="panel-head">
                <span class="panel-title codex" data-i18n>Codex service status</span>
                <span class="panel-overall" id="codexOverall" data-i18n>Checking…</span>
            </div>

            <div class="panel-rows" id="codexRows"></div>
        </div>

        <div class="panel-foot">
            <span class="panel-updated" id="panelUpdated">--</span>
            <span class="panel-links">
                <button class="panel-link" id="panelLink">status.claude.com →</button>
                <button class="panel-link" id="codexLink">status.openai.com →</button>
            </span>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="status-panel.js"></script>
</body>

</html>
